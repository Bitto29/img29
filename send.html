<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Send to img29</title>
<style>
  :root{
    --bg:#0f0d0c; --bg-deep:#0a0908; --panel:#17130f; --border:#2a2523;
    --text:#f0ece7; --text-dim:#a89f97; --text-faint:#7a716a; --accent:#e8a13d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ width:100%; max-width:380px; text-align:center; }
  h1{ font-size:19px; margin:0 0 6px; }
  p{ color:var(--text-dim); font-size:13.5px; line-height:1.5; margin:0 0 26px; }
  .picker{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:40px 20px; border:1.5px dashed var(--border); border-radius:14px;
    background:var(--panel); cursor:pointer;
  }
  .picker svg{ width:34px; height:34px; stroke:var(--accent); fill:none; stroke-width:1.6; }
  .picker span{ font-size:13.5px; color:var(--text-dim); }
  input[type=file]{ display:none; }
  .status{ margin-top:18px; font-size:13px; color:var(--text-faint); min-height:18px; }
  .picker.disabled{ opacity:.45; pointer-events:none; }
  .code-field{ margin-bottom:22px; text-align:left; }
  .code-field label{ display:block; font-size:11.5px; letter-spacing:.02em; color:var(--text-faint); margin-bottom:6px; }
  .code-field input{
    width:100%; background:var(--bg-deep); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:10px; font-size:16px; letter-spacing:.12em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-align:center;
    text-transform:uppercase; outline:none;
  }
  .code-field input:focus{ border-color:var(--accent); }
  .code-field .code-hint{ font-size:11.5px; color:var(--text-faint); margin-top:6px; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Send photos to your laptop</h1>
    <p>Enter the code shown on your laptop (or scan its QR code), then pick your photo(s).</p>

    <div class="code-field">
      <label for="codeInput">Code from your laptop</label>
      <input type="text" id="codeInput" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 482913" autocomplete="off" spellcheck="false">
      <div class="code-hint" id="codeHint"></div>
    </div>

    <label class="picker disabled" id="picker">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>
      <span id="pickerLabel">Tap to choose photo(s)</span>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </label>

    <div class="preview" id="preview"><img id="previewImg" alt=""></div>
    <div class="status" id="status"></div>
  </div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const picker = document.getElementById('picker');
  const pickerLabel = document.getElementById('pickerLabel');
  const fileInput = document.getElementById('fileInput');
  const status = document.getElementById('status');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const codeInput = document.getElementById('codeInput');
  const codeHint = document.getElementById('codeHint');

  const CODE_RE = /^[0-9]{6}$/;
  let code = '';

  function setCode(value){
    code = (value || '').replace(/\D/g, '').slice(0, 6);
    const valid = CODE_RE.test(code);
    picker.classList.toggle('disabled', !valid);
    codeHint.textContent = code && !valid ? 'Codes are 6 digits — double check it.' : '';
    return valid;
  }

  const fromUrl = params.get('code');
  if(fromUrl){
    codeInput.value = fromUrl.replace(/\D/g, '').slice(0, 6);
    setCode(fromUrl);
  }
  codeInput.addEventListener('input', ()=>{
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    setCode(codeInput.value);
  });

  const MAX_DIM = 1600; // keeps each upload small/fast and safely under the server's size limit
  const MAX_IMAGES = 10;

  fileInput.addEventListener('click', (e)=>{
    if(!setCode(codeInput.value)){
      e.preventDefault();
      codeInput.focus();
      status.textContent = 'Enter the code from your laptop first.';
      status.className = 'status err';
    }
  });

  fileInput.addEventListener('change', async ()=>{
    if(!setCode(codeInput.value)) return;
    const files = Array.from(fileInput.files || []).filter(f => f.type && f.type.startsWith('image/'));
    if(!files.length) return;
    if(files.length > MAX_IMAGES){
      status.textContent = `Pick ${MAX_IMAGES} photos or fewer at a time.`;
      status.className = 'status err';
      return;
    }
    fileInput.disabled = true;
    codeInput.disabled = true;
    picker.style.pointerEvents = 'none';
    picker.style.opacity = '.6';
    status.innerHTML = `<span class="spinner"></span>Sending ${files.length} photo${files.length>1?'s':''}…`;
    status.className = 'status';

    try{
      const dataUrls = await Promise.all(files.map(f => downscaleToDataUrl(f, MAX_DIM)));
      previewImg.src = dataUrls[0];
      preview.style.display = 'block';

      const res = await fetch('/api/relay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, images: dataUrls })
      });
      if(!res.ok){
        const body = await res.json().catch(()=>({}));
        throw new Error(body.error || 'Upload failed');
      }

      status.textContent = `Sent ${files.length} photo${files.length>1?'s':''}! Check your laptop.`;
      status.className = 'status ok';
      pickerLabel.textContent = 'Sent ✓';
    }catch(err){
      console.error(err);
      status.textContent = err.message && err.message !== 'Upload failed'
        ? `Couldn't send: ${err.message}`
        : "Something went wrong sending that. Try again.";
      status.className = 'status err';
      fileInput.disabled = false;
      codeInput.disabled = false;
      picker.style.pointerEvents = '';
      picker.style.opacity = '';
    }
  });

  function downscaleToDataUrl(file, maxDim){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        const longest = Math.max(w, h);
        if(longest > maxDim){
          const scale = maxDim / longest;
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = url;
    });
  }
})();
</script>
</body>
</html>
